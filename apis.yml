name: Beckon
description: >-
  Beckon was a marketing analytics and marketing performance measurement SaaS
  platform, founded in 2011 and headquartered in San Mateo, California. Its
  product automated the ingestion, harmonization, and normalization of marketing
  data from across paid, owned, and earned channels into a single unified set of
  metrics and dashboards, giving marketing teams a "total marketing intelligence"
  view of spend, performance, and ROI. Beckon was venture-backed by Canaan
  Partners and Storm Ventures, and was subsequently acquired into the IgniteTech
  (ESW Capital / Trilogy) portfolio. The independent beckon.com domain now
  redirects to its acquirer, IgniteTech, and the company no longer operates a
  public developer program, API documentation, or developer portal of its own.
